name: kundal_security
description: "Kundal Security Platform Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.19
  firebase_storage: ^11.5.6
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  camera: ^0.10.5+9
  qr_code_scanner: ^1.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
